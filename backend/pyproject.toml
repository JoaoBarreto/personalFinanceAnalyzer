[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance-analyzer-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "fastapi",
    "pydantic>=2",
    "argon2-cffi",
    "uvicorn",
    "python-multipart",
    "unidecode",
    "xlrd>=2.0.1",
    "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx", "xlwt"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

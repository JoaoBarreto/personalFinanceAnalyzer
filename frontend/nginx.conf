server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 11m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

  # O backend é resolvido em CADA pedido (variável + resolver): se o contentor do backend for recriado (novo IP),
  # o nginx acompanha-o em vez de dar 502 até ser reiniciado. NGINX_LOCAL_RESOLVERS vem do /etc/resolv.conf do
  # contentor (Docker ou Podman) e este ficheiro é um template processado no arranque pela imagem do nginx.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

  location /api/ {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri /index.html;
  }
}
